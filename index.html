<div id="loadError" class="load-error" hidden role="alert">
  <h2>無法載入遊戲設定</h2>
  <p>本遊戲使用 ES 模組與 JSON 設定檔，必須透過網頁伺服器開啟（直接雙擊 index.html 會被瀏覽器擋下）。<br>
     在此資料夾執行 <code>python3 -m http.server 8000</code>，再開啟 <code>http://localhost:8000/</code> 即可；或直接部署到 GitHub Pages 等靜態空間。</p>
  <pre></pre>
</div>

<script>
// 直接用 file:// 開啟時，瀏覽器會擋下 ES 模組（main.js 不會執行），這裡先顯示說明
if (location.protocol === 'file:') { document.getElementById('loadError').hidden = false; var ld = document.getElementById('loader'); if (ld) ld.remove(); }
</script>
<script type="module" src="js/main.js"></script>
<script>
// 載入畫面的文字與保險機制（要放在 main.js 的 <script> 之後，才抓得到該元素）：久候提示 → 逾時 / 模組載入失敗時改顯示失敗訊息與「重新整理」按鈕（正常載入完成後由 js/ui/loader.js 收起畫面）
(function(){
  var box = document.getElementById('loader'), txt = document.getElementById('ldText'), btn = document.getElementById('ldReload'), T = window.__u11Loader;
  if (!box || !T) return;
  var alive = function(){ return box.isConnected && !box.classList.contains('hide'); };
  txt.textContent = T.load; btn.textContent = T.reload;
  btn.addEventListener('click', function(){ location.reload(); });
  var fail = function(){ if (!alive()) return; txt.textContent = T.fail; btn.hidden = false; };
  setTimeout(function(){ if (alive() && btn.hidden) txt.textContent = T.slow; }, 6000);
  setTimeout(fail, 20000);
  window.addEventListener('error', function(e){ if (e instanceof ErrorEvent) fail(); });
  document.querySelector('script[type="module"]').addEventListener('error', fail);
})();
</script>
