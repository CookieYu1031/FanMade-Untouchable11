<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Untouchable 11</title>
<meta name="description" content="遊玩Carl Hoff經典Puzzle《Untouchable 11》與其衍伸作">
<meta property="og:title" content="Untouchable 11">
<meta property="og:description" content="遊玩Carl Hoff經典Puzzle《Untouchable 11》與其衍伸作">
<meta property="og:url" content="https://cookieyu1031.github.io/untouchable11/">
<meta property="og:type" content="website">
<meta property="og:image" content="https://cookieyu1031.github.io/untouchable11/assets/thumbnail.png">
<meta property="og:image:width" content="1258">
<meta property="og:image:height" content="661">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/hero.css">
<link rel="stylesheet" href="css/levels.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/board.css">
<link rel="stylesheet" href="css/tray.css">
<link rel="stylesheet" href="css/book.css">
<link rel="stylesheet" href="css/help.css">
<link rel="stylesheet" href="css/solution.css">
<link rel="stylesheet" href="css/modals.css">
<link rel="stylesheet" href="css/settings.css">
<link rel="stylesheet" href="css/stats.css">
</head>
<body>
<div class="wrap">
  <header class="hero">
    <h1 id="heroTitle">Untouchable 11</h1>
    <div class="hero-acts">
      <button class="ibtn" id="btnInfo" style="width:30px;height:30px" data-i18n-title="tip.info"><svg viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg></button>
      <button class="ibtn" id="btnSettings" style="width:30px;height:30px" data-i18n-title="tip.settings"><svg viewBox="0 0 24 24"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg></button>
    </div>
  </header>

  <nav class="levels" id="levels" aria-label="難度選擇"></nav>

  <div class="layout">
    <section class="panel stage" style="--c:var(--lvc)">
      <h2><span id="levelTitle"></span><span class="h2-acts">
          <button class="ibtn" id="btnSpecial" hidden style="width:30px;height:30px" data-i18n-title="tip.special"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 11v6"/><path d="M12 7h.01"/></svg></button>
          <button class="ibtn" id="btnUndo" style="width:30px;height:30px" data-i18n-title="tip.undo" disabled><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5a5.5 5.5 0 0 1-5.5 5.5H11"/></svg></button>
          <button class="ibtn" id="btnReset" style="width:30px;height:30px" data-i18n-title="tip.reset"><svg viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M10 11v6"/><path d="M14 11v6"/></svg></button></span></h2>
      <div class="board-wrap" id="boardWrap">
        <svg id="board" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="拼圖底板">
          <g id="gGrid"></g>
          <g id="gPieces"></g>
          <g id="gPreview" style="pointer-events:none"></g>
          <g id="gOverlay" style="pointer-events:none"></g>
        </svg>
      </div>
    </section>

    <aside class="side">
      <section class="panel tray-panel" style="--c:var(--p6)">
        <h2><span data-i18n="tray.title"></span><span class="h2-acts"><button class="ibtn" id="btnHelp" style="width:30px;height:30px" data-i18n-title="tip.help"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg></button></span></h2>
        <div class="tray" id="tray"></div>
      </section>

      <section class="panel book-panel" style="--c:var(--p4)">
        <h2><span data-i18n="book.title"></span><span class="h2-acts"><button class="ibtn" id="btnHide" style="width:30px;height:30px"></button><button class="ibtn" id="btnStats" style="width:30px;height:30px" data-i18n-title="tip.stats"><svg viewBox="0 0 24 24"><path d="M18 20V10"/><path d="M12 20V4"/><path d="M6 20v-6"/></svg></button></span></h2>
        <div class="body">
          <div id="bookInfo"></div>
          <div class="book-thumbs" id="bookThumbs"></div>
          <div class="nearzone" id="nearZone" hidden>
            <div id="nearInfo"></div>
            <div class="book-thumbs" id="nearThumbs"></div>
            <p class="neardesc" id="nearDesc"></p>
          </div>
        </div>
      </section>
    </aside>
  </div>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<div class="ptools" id="pieceTools" hidden>
  <button class="ibtn" data-act="ccw" data-i18n-title="tip.ccw"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg></button>
  <button class="ibtn" data-act="cw" data-i18n-title="tip.cw"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg></button>
  <button class="ibtn" data-act="flip" data-i18n-title="tip.flip"><svg viewBox="0 0 24 24"><path d="M12 3v18" stroke-dasharray="2 3"/><path d="M8 7l-5 5 5 5V7z"/><path d="M16 7l5 5-5 5V7z"/></svg></button>
  <button class="ibtn" data-act="return" data-i18n-title="tip.return"><svg viewBox="0 0 24 24"><path d="M12 4v10"/><path d="m7 10 5 5 5-5"/><path d="M5 20h14"/></svg></button>
</div>

<div class="modal" id="helpModal">
  <div class="box">
    <div class="panel" style="margin:0;border:0;border-radius:0">
      <h2 style="--c:var(--p6);background:var(--p6)"><span data-i18n="help.title"></span><button class="ibtn" id="helpClose" style="width:30px;height:30px" data-i18n-title="tip.close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></h2>
    </div>
    <div class="help">
      <section class="hsec">
        <ul>
          <li data-i18n="help.l1"></li>
          <li data-i18n="help.l2"></li>
          <li data-i18n="help.l3"></li>
        </ul>
      </section>
      <section class="hsec">
        <div class="keys">
          <div class="key" data-k="a"><kbd>A</kbd><span data-i18n="key.ccw"></span></div>
          <div class="key" data-k="d"><kbd>D</kbd><span data-i18n="key.cw"></span></div>
          <div class="key" data-k="s"><kbd>S</kbd><span data-i18n="key.flip"></span></div>
          <div class="key" data-k="x"><kbd>X</kbd><span data-i18n="key.return"></span></div>
          <div class="key" data-k="z"><kbd>Z</kbd><span data-i18n="key.undo"></span></div>
              <div class="key" data-k="Delete"><kbd>Delete</kbd><span data-i18n="key.reset"></span></div>
        </div>
      </section>
    </div>
  </div>
</div>

<div class="modal" id="specialModal">
  <div class="box">
    <div class="panel" style="margin:0;border:0;border-radius:0">
      <h2 style="--c:var(--lvc);background:var(--lvc);color:var(--lvink,#2B2E4A)"><span data-i18n="sp.title"></span><button class="ibtn" id="specialClose" style="width:30px;height:30px" data-i18n-title="tip.close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></h2>
    </div>
    <div class="help" id="specialBody"></div>
  </div>
</div>

<div class="modal" id="infoModal">
  <div class="box" style="width:min(520px,100%)">
    <div class="panel" style="margin:0;border:0;border-radius:0">
      <h2 style="--c:var(--blue);background:var(--blue)"><span data-i18n="info.title"></span><button class="ibtn" id="infoClose" style="width:30px;height:30px" data-i18n-title="tip.close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></h2>
    </div>
    <div class="help" data-i18n-html="info.html"></div>
  </div>
</div>

<div class="modal" id="solModal">
  <div class="solwrap">
    <div class="solrow">
    <button class="navbtn prev" id="solPrev" type="button" hidden data-nosound aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="box">
      <div class="panel" style="margin:0;border:0;border-radius:0">
        <h2 id="solBar" style="--c:var(--p4);background:var(--p4)"><span id="solTitle"></span><button class="ibtn" id="solClose" style="width:30px;height:30px" data-i18n-title="tip.close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></h2>
      </div>
      <div id="solView" style="padding:16px;display:grid;place-items:center;overflow:auto;max-height:calc(100vh - 240px)"></div>
      <div class="solmeta"><span id="solTime"></span><span id="solIdx"></span><b id="solNick"></b></div>
    </div>
    <button class="navbtn next" id="solNext" type="button" hidden data-nosound aria-label="Next"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>
    <button class="sharebtn" id="solShare"><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></svg><span data-i18n="share"></span></button>
  </div>
</div>

<div class="modal" id="statModal">
  <div class="box" style="width:min(720px,100%)">
    <div class="panel" style="margin:0;border:0;border-radius:0">
      <h2 style="--c:var(--p4);background:var(--p4)"><span id="statTitle"></span><span style="display:flex;gap:8px"><button class="ibtn" id="statSwitch" style="width:30px;height:30px" aria-pressed="false"></button><button class="ibtn" id="statClose" style="width:30px;height:30px" data-i18n-title="tip.close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></span></h2>
    </div>
    <div style="overflow:auto;max-height:calc(100vh - 140px)"><table class="stat" id="statTable"></table></div>
  </div>
</div>

<div class="modal" id="setModal">
  <div class="box" style="width:min(560px,100%);max-height:100%;overflow:auto">
    <div class="panel" style="margin:0;border:0;border-radius:0">
      <h2 style="--c:var(--blue);background:var(--blue)"><span data-i18n="set.title"></span><button class="ibtn" id="setClose" style="width:30px;height:30px" data-i18n-title="tip.close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></h2>
    </div>
    <div class="setbody">
      <div class="srow srow2">
        <div class="sgrp sgrp-nick"><label for="nickInput" data-i18n="set.nick"></label><input id="nickInput" maxlength="20" autocomplete="off" data-i18n-ph="set.nickPh"></div>
        <div class="sgrp sgrp-vol sgrp-lang"><label for="selLang" data-i18n="set.lang"></label><div class="selwrap"><select id="selLang" class="sel"><option value="zh">中文</option><option value="en">English</option><option value="ja">日本語</option></select></div></div>
      </div>
      <div class="srow srow2">
        <div class="sgrp"><span data-i18n="set.theme"></span><div class="seg" id="segTheme"><button data-theme="light" data-i18n-title="theme.light"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg></button><button data-theme="dark" data-i18n-title="theme.dark"><svg viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></button></div></div>
        <div class="sgrp sgrp-vol"><span data-i18n="set.vol"></span><div class="vol"><b id="volNum"></b><div class="vslider"><input type="range" id="volRange" min="0" max="10" step="1" data-nosound aria-label="Volume"><div class="vticks" id="volTicks"></div></div></div></div>
      </div>
      <div class="srow"><span><span data-i18n="set.extra"></span><small class="sub" data-i18n="set.extraDesc"></small></span><button class="switch" id="swExtra" role="switch" aria-checked="false" data-i18n-title="set.extra"><i></i></button></div>
    </div>
    <div class="shead shead-row"><span data-i18n="set.data"></span>
      <div class="tg">
        <button class="btn" id="dataDownload" data-i18n="data.export"></button>
        <button class="btn" id="dataPick" data-i18n="data.pickFile"></button>
        <input type="file" id="dataFile" accept=".json,application/json" hidden>
      </div>
    </div>
    <div class="sdesc" data-i18n="set.dataDesc"></div>
    <details class="jsonbox" id="jsonBox">
      <summary data-i18n="data.showJson"></summary>
      <textarea id="dataText" spellcheck="false" data-i18n-ph="data.ph"></textarea>
    </details>
    <div id="dataMsg"></div>
    <div class="dzone">
      <div class="srow srow-reset"><span><span data-i18n="reset.title"></span><small class="sub" data-i18n="reset.desc"></small></span><button class="btn danger" id="resetOpen" data-i18n="reset.btn"></button></div>
    </div>
  </div>
</div>

<div class="modal" id="boardResetModal">
  <div class="box" style="width:min(420px,100%)">
    <div class="panel" style="margin:0;border:0;border-radius:0">
      <h2 style="--c:#F28B8B;background:#F28B8B"><span data-i18n="brd.title"></span><button class="ibtn" id="brdClose" style="width:30px;height:30px" data-i18n-title="tip.close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></h2>
    </div>
    <div class="sdesc" style="padding:16px 18px 0;font-size:13.5px;color:var(--ink)" data-i18n="brd.desc"></div>
    <div class="tools" style="padding:16px 14px 14px;justify-content:flex-end">
      <button class="btn" id="brdCancel" data-i18n="reset.cancel"></button>
      <button class="btn danger" id="brdConfirm" data-nosound data-i18n="brd.confirm"></button>
    </div>
  </div>
</div>

<div class="modal" id="resetModal">
  <div class="box" style="width:min(460px,100%)">
    <div class="panel" style="margin:0;border:0;border-radius:0">
      <h2 style="--c:#F28B8B;background:#F28B8B"><span data-i18n="reset.confirmTitle"></span><button class="ibtn" id="resetClose" style="width:30px;height:30px" data-i18n-title="tip.close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></h2>
    </div>
    <div class="sdesc" style="padding-top:14px;font-size:13.5px;color:var(--ink)" data-i18n="reset.confirmDesc"></div>
    <input class="txt" id="resetInput" autocomplete="off" spellcheck="false" data-i18n-ph="reset.ph">
    <div class="tools" style="padding:14px;justify-content:flex-end">
      <button class="btn" id="resetCancel" data-i18n="reset.cancel"></button>
      <button class="btn danger" id="resetConfirm" data-i18n="reset.confirm" disabled></button>
    </div>
  </div>
</div>

<div id="loadError" class="load-error" hidden role="alert">
  <h2>無法載入遊戲設定</h2>
  <p>本遊戲使用 ES 模組與 JSON 設定檔，必須透過網頁伺服器開啟（直接雙擊 index.html 會被瀏覽器擋下）。<br>
     在此資料夾執行 <code>python3 -m http.server 8000</code>，再開啟 <code>http://localhost:8000/</code> 即可；或直接部署到 GitHub Pages 等靜態空間。</p>
  <pre></pre>
</div>

<script>
// 直接用 file:// 開啟時，瀏覽器會擋下 ES 模組（main.js 不會執行），這裡先顯示說明
if (location.protocol === 'file:') document.getElementById('loadError').hidden = false;
</script>
<script type="module" src="js/main.js"></script>
</body>
</html>
